; Freenove ESP32-S3-WROOM N16R8 (16 MB flash QIO, 8 MB PSRAM octal), USB nativo /dev/ttyACM0
; Firmware de la base: tracción diferencial (2 × IBT-2 + 42GM-895H), IMU, 3 × HC-SR04, 3 bumpers, seta.
; El GPS está en la Pi (nmea_navsat_driver); lib/UP501 queda en firmware/lib por si vuelve.
[platformio]
; Sin esto, pio run -t upload flashea todos los entornos seguidos
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
upload_port = /dev/ttyACM0
; En esta PC el reset por RTS después de flashear deja la S3 en modo descarga; el del watchdog arranca bien
board_upload.after_reset = watchdog_reset
monitor_port = /dev/ttyACM0
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
build_flags =
    -DBOARD_HAS_PSRAM
    ; Serial por el USB nativo (/dev/ttyACM0)
    -DARDUINO_USB_CDC_ON_BOOT=1
; Drivers compartidos de firmware/lib enlazados (no copiados). lib/BaseLogica es propia de la base.
lib_deps =
    symlink://../lib/BTS7960
    symlink://../lib/EncoderPCNT
    symlink://../lib/ControlArticulacion
    symlink://../lib/HCSR04
    symlink://../lib/MPU9250

; Con micro-ROS: el USB lo usa el agente (sin monitor serial). Mismo firmware; /cmd_vel y los comandos llegan por tópicos.
;   pio run -e ros -t upload     (detener antes el agente: tiene abierto /dev/ttyACM0)
;   ros2 run micro_ros_agent micro_ros_agent serial --dev /dev/ttyACM0
; La primera compilación arma micro-ROS Jazzy para el ESP32-S3 (varios minutos) y queda en .pio/libdeps/ros.
[env:ros]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
upload_port = /dev/ttyACM0
; En esta PC el reset por RTS después de flashear deja la S3 en modo descarga; el del watchdog arranca bien
board_upload.after_reset = watchdog_reset
board_microros_distro = jazzy
board_microros_transport = serial
; Límites de entidades más holgados que el colcon.meta por defecto (la base usa 9 publishers)
board_microros_user_meta = microros.meta
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSAR_MICROROS
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
    symlink://../lib/BTS7960
    symlink://../lib/EncoderPCNT
    symlink://../lib/ControlArticulacion
    symlink://../lib/HCSR04
    symlink://../lib/MPU9250
    symlink://../lib/EnlaceMicroRos

; Primera prueba de tracción con las ruedas en el aire, sin IMU ni HC-SR04: ignora la IMU y la distancia al frente.
; NUNCA en el piso. pio run -e ros_motores (después volver a flashear el env ros)
[env:ros_motores]
extends = env:ros
build_flags =
    ${env:ros.build_flags}
    -DPRUEBA_MOTORES

; Pruebas de la lógica en la PC, sin placa: pio test -e native
[env:native]
platform = native
test_build_src = no
build_flags = -std=gnu++17 -I../lib/EncoderPCNT  ; solo Desenvolver.h (sin Arduino)
lib_compat_mode = off
lib_deps = symlink://../lib/ControlArticulacion
