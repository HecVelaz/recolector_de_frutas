; Freenove ESP32-S3-WROOM N16R8 (16 MB flash QIO, 8 MB PSRAM octal), USB nativo /dev/ttyACM0
; Firmware de la base: tracción diferencial (2 × IBT-2 + 36GP-555), IMU, GPS, 3 × HC-SR04, 4 bumpers, seta.
[platformio]
; Sin esto, pio run -t upload flashea todos los entornos seguidos
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
build_flags =
    -DBOARD_HAS_PSRAM
    ; Serial por el USB nativo (/dev/ttyACM0)
    -DARDUINO_USB_CDC_ON_BOOT=1
; Drivers compartidos de firmware/lib enlazados (no copiados). lib/BaseLogica es propia de la base.
lib_deps =
    symlink://../lib/BTS7960
    symlink://../lib/EncoderPCNT
    symlink://../lib/ControlArticulacion
    symlink://../lib/HCSR04
    symlink://../lib/MPU9250
    symlink://../lib/UP501
    mikalhart/TinyGPSPlus@^1.1.0

; Pruebas de la lógica en la PC, sin placa: pio test -e native
[env:native]
platform = native
test_build_src = no
build_flags = -std=gnu++17
lib_compat_mode = off
lib_deps = symlink://../lib/ControlArticulacion
