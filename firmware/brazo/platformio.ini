; ESP32-WROOM-32D (ESP32 clásico, 4 MB flash) en una DevKit con USB-serie CH340 (1a86:7523, /dev/ttyUSB0)
; Firmware del brazo: J1 (36GP-555 + IBT-2), J2/J3 (5840-31ZY + L298N) y pinza (2 servos), lazo cerrado.
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
; Drivers compartidos de firmware/lib enlazados (no copiados)
lib_deps =
    symlink://../lib/ControlArticulacion
    symlink://../lib/BTS7960
    symlink://../lib/EncoderPCNT
    symlink://../lib/L298N

; Con micro-ROS: el USB lo usa el agente (sin monitor serial). Mismo firmware; los comandos llegan por tópicos.
;   pio run -e ros -t upload     (detener antes el agente: tiene abierto /dev/ttyUSB0)
;   ros2 run micro_ros_agent micro_ros_agent serial --dev /dev/ttyUSB0
; La primera compilación arma micro-ROS Jazzy para el ESP32 (varios minutos) y queda en .pio/libdeps/ros.
[env:ros]
platform = espressif32
board = esp32dev
framework = arduino
board_microros_distro = jazzy
board_microros_transport = serial
; Límites de entidades más holgados que el colcon.meta por defecto
board_microros_user_meta = microros.meta
build_flags = -DUSAR_MICROROS
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
    symlink://../lib/ControlArticulacion
    symlink://../lib/BTS7960
    symlink://../lib/EncoderPCNT
    symlink://../lib/L298N
    symlink://../lib/EnlaceMicroRos

; Pruebas del control en la PC, sin placa: pio test -e native
[env:native]
platform = native
test_build_src = no
build_flags = -std=gnu++17
lib_compat_mode = off
lib_deps = symlink://../lib/ControlArticulacion
